   <header>
      <h1>

   <article>
      <h2>Shipping Address</h2>
      <form>
      
         <fieldset id="addroptions">
            <legend><span>Choose an address</span></legend>
            <label for="homeoption" id="homeaddr">
               <div>Home</div>
               <!-- sets text to variables declared variables-->
               <script> document.getElementById("homeaddr").innerHTML = homestreet + "<br>" + workCity +","+workState+ " "+workCode</script>
               <!--Add an onlick to the input-->
               <input type="radio" id="homeoption" name="shippingaddr" onclick = "Click()"/>
               <script>
                  function Click() {
                     //assigns each element to a variable
                     document.getElementById("street") = homestreet
                     document.getElementById("city") = homeCity
                     document.getElementById("homeState") = homeState
                     document.getElementById("code") = homeCode
                  }
               </script>
            </label>
            <label for="workoption" id="workaddr">
               <div>Work</div>
               <!--Add an onlick to the input-->
               <input type="radio" id="workoption" name="shippingaddr" onclick="Click2()"/>
               <script>function Click2() {
                  //assigns each element to a variable
                  document.getElementById("workStreet") = workStreet
                  document.getElementById("workCity") = workCity
                  document.getElementById("workState") = workState
                  document.getElementById("workCode") = workCode
               }</script>
            </label>
         </fieldset>
         
         
          <fieldset id="contactinfo">
            <label for="street">
              Street Address
              <input type="text" id="street" />
            </label>
            <label for="city">
              City
              <input type="text" id="city" />
            </label>
            <label for="state">
              State
              <input type="text" id="state" />
            </label>
            <label for="code">
              Zip
              <input type="text" id="code" />
            </label>
          </fieldset>
          
     </form>
